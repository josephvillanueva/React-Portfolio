<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="description"
      content="Joseph Villanueva, Systems Analyst and UI/UX Lead moving into product ownership, who came up shipping React and Next.js apps."
    />
    <title>Joseph Villanueva | Systems Analyst &amp; Product</title>
    <!-- Applies a saved theme before first paint so the page never flashes
         the wrong one. Without a saved choice, CSS follows the system. -->
    <script>
      try {
        var theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") {
          document.documentElement.dataset.theme = theme;
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
