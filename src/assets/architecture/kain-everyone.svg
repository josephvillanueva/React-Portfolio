<rect class="zone" x="16" y="16" width="1208" height="174" rx="12"/><text class="zlabel" x="36" y="46">PHONE</text><text class="zsub" x="36" y="66">An installable web app (PWA). Signed in with Google.</text>
<rect class="zone" x="16" y="226" width="1208" height="150" rx="12"/><text class="zlabel" x="36" y="256">VERCEL</text><text class="zsub" x="36" y="276">Next.js 16 App Router.</text>
<rect class="zone" x="16" y="412" width="1208" height="212" rx="12"/><text class="zlabel" x="36" y="442">SUPABASE</text><text class="zsub" x="36" y="462">Postgres with row-level security. Every change to a shared QR goes through a database function.</text>
