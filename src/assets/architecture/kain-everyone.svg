<rect class="node key" x="48" y="490" width="330" height="74" rx="10"/><text class="ntitle" x="64" y="517">Database functions</text><text class="ntext" x="64" y="538">Atomic claim: one QR, one person</text><text class="ntext" x="64" y="555">Polls, bans, points, 170+ pgTAP tests</text>
