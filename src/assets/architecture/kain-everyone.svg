<rect class="node" x="340" y="96" width="230" height="74" rx="10"/><text class="ntitle" x="356" y="123">Show QR</text><text class="ntext" x="356" y="144">QRs cached on the phone</text><text class="ntext" x="356" y="161">Mark used, points at midnight</text>
<rect class="node" x="612" y="96" width="250" height="74" rx="10"/><text class="ntitle" x="628" y="123">Groups, polls, nudges</text><text class="ntext" x="628" y="144">Lunch out?, Kain?, Tara Labas?</text><text class="ntext" x="628" y="161">Pop-ups over any screen</text>
