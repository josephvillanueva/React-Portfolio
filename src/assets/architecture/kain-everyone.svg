<rect class="node" x="904" y="490" width="300" height="74" rx="10"/><text class="ntitle" x="920" y="517">pg_cron</text><text class="ntext" x="920" y="538">9:00 WFH auto-share in SQL</text><text class="ntext" x="920" y="555">Calls the reminder endpoint</text>
