    <circle cx="443" cy="717" r="3" fill="#7f88ac"/>
    <text x="463" y="723" fill="#c6c9e5" font-size="19">Human decisions</text>
    <text x="1206" y="750" fill="#9fa8cc" font-size="15" text-anchor="end">EXPERIMENTAL / NOT AN ANONYMITY GUARANTEE</text>
