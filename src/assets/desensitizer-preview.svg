    <text x="75" y="205" fill="#c6c9e5" font-size="25">Protect identity. Preserve business meaning.</text>
    <path d="M1111 88 1181 117V168C1181 211 1153 245 1111 266 1069 245 1041 211 1041 168V117Z" fill="url(#shield)"/>
    <path d="m1081 169 20 20 41-43" fill="none" stroke="#17172e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="72" y="264" width="1136" height="408" rx="26" fill="#1b1d37" stroke="#656c9d" stroke-opacity="0.45"/>
    <rect x="72" y="264" width="1136" height="65" rx="26" fill="#292c4d"/>
    <rect x="72" y="302" width="1136" height="27" fill="#292c4d"/>
    <circle cx="104" cy="296" r="6" fill="#647197"/>
    <circle cx="126" cy="296" r="6" fill="#647197"/>
    <circle cx="148" cy="296" r="6" fill="#647197"/>
    <text x="184" y="303" fill="#d8def5" font-size="18">Protected document / synthetic example</text>
    <text x="115" y="375" fill="#a4d9ff" font-size="14" font-weight="700" letter-spacing="2">IDENTIFYING SPANS</text>
    <rect x="112" y="398" width="274" height="48" rx="10" fill="#354567" stroke="#6baeff" stroke-opacity="0.6"/>
    <text x="136" y="429" fill="#e1f2ff" font-family="Consolas, monospace" font-size="23">[PERSON_001]</text>
    <rect x="404" y="398" width="316" height="48" rx="10" fill="#354567" stroke="#6baeff" stroke-opacity="0.6"/>
    <text x="425" y="429" fill="#e1f2ff" font-family="Consolas, monospace" font-size="23">[ORGANIZATION_001]</text>
    <rect x="738" y="398" width="274" height="48" rx="10" fill="#354567" stroke="#6baeff" stroke-opacity="0.6"/>
    <text x="762" y="429" fill="#e1f2ff" font-family="Consolas, monospace" font-size="23">[EMAIL_001]</text>

    <text x="115" y="494" fill="#9bdcc8" font-size="14" font-weight="700" letter-spacing="2">BUSINESS RULES RETAINED</text>
