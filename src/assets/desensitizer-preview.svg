<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title description">
  <title id="title">Desensitizer, local-first document privacy</title>
  <desc id="description">Synthetic product illustration. Identifying spans use abstract replacement tokens while business rules stay readable. No real document or personal information is shown.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#17172e"/>
      <stop offset="1" stop-color="#303060"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0.9" y2="1">
      <stop stop-color="#76caff"/>
      <stop offset="1" stop-color="#4d8cff"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="800" fill="url(#background)"/>
  <circle cx="1157" cy="95" r="272" fill="#4db5ff" opacity="0.06"/>
  <circle cx="64" cy="754" r="234" fill="#7b75e8" opacity="0.08"/>
