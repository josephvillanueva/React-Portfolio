[build]
  command = "npm run build"
  publish = "dist"

# Netlify pins a site to the Node version it was created with, which predates
# this project's move to Vite. Vite 8 requires ^20.19.0 || >=22.12.0.
[build.environment]
  NODE_VERSION = "22"

# Single-page app: serve index.html for any unmatched path.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
